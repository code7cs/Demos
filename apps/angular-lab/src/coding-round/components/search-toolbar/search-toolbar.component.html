<section class="toolbar" aria-label="Transaction search and filters">
  <label class="field">
    <span>Search</span>
    <input
      type="search"
      placeholder="Merchant or description"
      [value]="search()"
      [disabled]="loading()"
      (input)="onSearchInput($event)"
    />
  </label>

  <label class="field">
    <span>Status</span>
    <select [value]="status()" [disabled]="loading()" (change)="onStatusChange($event)">
      <option value="all">All</option>
      <option value="posted">Posted</option>
      <option value="pending">Pending</option>
      <option value="failed">Failed</option>
    </select>
  </label>
</section>
